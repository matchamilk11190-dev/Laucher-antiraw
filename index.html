<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiếu</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      display: flex; justify-content: center; align-items: center;
      color: white; overflow-x: hidden; position: relative; padding: 30px 15px;
    }
    .stars, .snow-container { position: absolute; inset: 0; pointer-events: none; }
    .stars { z-index: 0; } .snow-container { z-index: 1; }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:0.2} 50%{opacity:1} }
    .snowflake {
      position: absolute; top: -20px; background: white; border-radius: 50%;
      animation: fall linear infinite; box-shadow: 0 0 6px rgba(255,255,255,0.55);
    }
    .snowflake.layer-1 { filter: blur(0.3px); }
    .snowflake.layer-2 { filter: blur(0.8px); opacity: 0.6; }
    .snowflake.layer-3 { filter: blur(1.4px); opacity: 0.4; }
    @keyframes fall {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      25% { transform: translateY(25vh) translateX(12px) rotate(90deg); }
      50% { transform: translateY(50vh) translateX(-8px) rotate(180deg); }
      75% { transform: translateY(75vh) translateX(15px) rotate(270deg); }
      100% { transform: translateY(110vh) translateX(-5px) rotate(360deg); }
    }
    .container {
      text-align: center; padding: 20px; position: relative; z-index: 10;
      width: 100%; max-width: 520px;
    }
    .name-circle {
      width: 130px; height: 130px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.55);
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto 18px; background: rgba(9,10,15,0.75);
    }
    .name-circle span {
      font-family: 'Dancing Script', cursive; font-size: 64px; font-weight: 700;
      color: white; text-shadow: 0 0 14px rgba(255,255,255,0.4);
    }
    .username { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; color: white; }
    .bio { font-size: 14px; color: #ccc; margin-bottom: 22px; }
    .music-icon { font-size: 24px; opacity: 0.85; margin-bottom: 24px; color: white; }

    .name-input, .code-box {
      width: 100%; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px; color: white; outline: none; margin-bottom: 12px;
    }
    .name-input { padding: 13px 16px; font-size: 15px; }
    .code-box {
      min-height: 150px; max-height: 230px; padding: 14px;
      font-family: Consolas, monospace; font-size: 13.5px; line-height: 1.5; resize: vertical;
      color: white;
    }
    .name-input::placeholder, .code-box::placeholder { color: #777; }

    .result-box {
      display: none;
      width: 100%;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .result-box.show { display: block; }
    .result-title { font-size: 13px; color: #aaa; margin-bottom: 8px; }
    .result-code {
      width: 100%;
      min-height: 110px;
      max-height: 200px;
      background: transparent;
      border: none;
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }

    .script-btn {
      display: block; width: 100%; padding: 14px 20px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50px; color: rgba(255,255,255,0.9); font-size: 15px;
      font-weight: 500; cursor: pointer; transition: 0.25s; margin-bottom: 11px;
    }
    .script-btn:hover { background: rgba(255,255,255,0.1); }
    .script-btn.primary {
      background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.35);
      font-weight: 600; font-size: 16px; padding: 16px;
    }
    .support { margin-top: 18px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="snow-container" id="snow"></div>

  <div class="container">
    <div class="name-circle"><span>H</span></div>
    <div class="username">Hiếu</div>
    <div class="bio">Link to my latest adventures</div>
    <div class="music-icon">♪</div>

    <input type="text" class="name-input" id="scriptName" placeholder="Tên script (ví dụ: aim-lock)">
    <textarea class="code-box" id="codeInput" placeholder="Dán code Lua vào đây..."></textarea>

    <div class="result-box" id="resultBox">
      <div class="result-title" id="resultTitle">Loadstring:</div>
      <textarea class="result-code" id="resultCode" readonly></textarea>
    </div>

    <button class="script-btn primary" onclick="createRaw(this)">Tạo Raw</button>

    <button class="script-btn" onclick="copyScript(this, `loadstring(game:HttpGet(\\"https://luaforge-antiraw.netlify.app/raw/can-hllbjwx1SR3dyQ6j7fT47PY\\"))()`)">can evade</button>
    <button class="script-btn" onclick="copyScript(this, `loadstring(game:HttpGet(\\"https://luauforge-antiraw.netlify.app/raw/anti-ai-encoding-andes-BugUhsv7k9hbA3nZebG0efi\\"))()`)">script aim</button>
    <button class="script-btn" onclick="copyScript(this, 'https://matchamilk11190-dev.github.io/Wed-script-andes/')">get key script aim</button>

    <div class="support">andes.anti</div>
  </div>

  <script>
    const stars = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      const size = Math.random() * 2.2 + 0.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDuration = (Math.random() * 3 + 2) + 's';
      s.style.animationDelay = Math.random() * 5 + 's';
      stars.appendChild(s);
    }

    const snow = document.getElementById('snow');
    function createSnowflake(layer) {
      const flake = document.createElement('div');
      flake.className = `snowflake layer-${layer}`;
      const size = layer === 1 ? Math.random()*4+3 : layer === 2 ? Math.random()*3+2 : Math.random()*2+1;
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.left = Math.random() * 100 + 'vw';
      const duration = layer === 1 ? Math.random()*4+6 : layer === 2 ? Math.random()*5+9 : Math.random()*6+12;
      flake.style.animationDuration = duration + 's';
      flake.style.animationDelay = Math.random() * 8 + 's';
      snow.appendChild(flake);
    }
    for (let i = 0; i < 20; i++) createSnowflake(1);
    for (let i = 0; i < 28; i++) createSnowflake(2);
    for (let i = 0; i < 38; i++) createSnowflake(3);

    function copyScript(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const o = btn.innerText;
        btn.innerText = "Đã lưu!";
        setTimeout(() => btn.innerText = o, 1300);
      });
    }

    function validateLuaCode(code) {
      let stack = [];
      let inString = null;
      let escaped = false;
      
      for (let i = 0; i < code.length; i++) {
        let char = code[i];
        if (inString) {
          if (escaped) {
            escaped = false;
          } else if (char === '\\') {
            escaped = true;
          } else if (char === inString) {
            inString = null;
          }
          continue;
        }
        
        if (char === '"' || char === "'") {
          inString = char;
          continue;
        }
        
        if (char === '(' || char === '{' || char === '[') {
          stack.push(char);
        } else if (char === ')' || char === '}' || char === ']') {
          if (stack.length === 0) return false;
          let last = stack.pop();
          if ((char === ')' && last !== '(') ||
              (char === '}' && last !== '{') ||
              (char === ']' && last !== '[')) {
            return false;
          }
        }
      }
      if (inString !== null) return false;
      if (stack.length > 0) return false;
      return true;
    }

    async function createRaw(btn) {
      const code = document.getElementById('codeInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const resultCode = document.getElementById('resultCode');
      const resultTitle = document.getElementById('resultTitle');

      // Kiểm tra nếu chưa nhập code
      if (!code) {
        resultTitle.innerText = "Lỗi:";
        resultCode.value = "Bạn chưa nhập code! Vui lòng viết code vào ô trống để tạo raw.";
        resultCode.style.color = "#ff4d4d";
        resultBox.classList.add('show');
        const o = btn.innerText;
        btn.innerText = "Chưa có code!";
        setTimeout(() => btn.innerText = o, 1600);
        return;
      }

      // Kiểm tra cú pháp Lua
      if (!validateLuaCode(code)) {
        resultTitle.innerText = "Lỗi cú pháp:";
        resultCode.value = "Sai hàm code! Vui lòng kiểm tra lại cấu trúc ngoặc hoặc chuỗi trong mã Lua.";
        resultCode.style.color = "#ff4d4d";
        resultBox.classList.add('show');
        const o = btn.innerText;
        btn.innerText = "Lỗi code!";
        setTimeout(() => btn.innerText = o, 1600);
        return;
      }

      const oText = btn.innerText;
      btn.innerText = "Đang tạo raw...";
      btn.disabled = true;

      try {
        // Gửi code lên dịch vụ lưu trữ raw công khai để lấy link hoạt động thực tế
        const response = await fetch('https://www.toptal.com/developers/hastebin/documents', {
          method: 'POST',
          body: code
        });
        const data = await response.json();

        if (!data.key) throw new Error("Lỗi tạo raw");

        const rawUrl = `https://www.toptal.com/developers/hastebin/raw/${data.key}`;
        const finalScript = `loadstring(game:HttpGet("${rawUrl}"))()`;

        resultTitle.innerText = "Loadstring:";
        resultCode.style.color = "#7dffb3";
        resultCode.value = finalScript;
        resultBox.classList.add('show');

        await navigator.clipboard.writeText(finalScript);
        btn.innerText = "Đã tạo & Copy!";
      } catch (error) {
        resultTitle.innerText = "Lỗi kết nối:";
        resultCode.value = "Không thể kết nối máy chủ tạo raw. Vui lòng thử lại!";
        resultCode.style.color = "#ff4d4d";
        resultBox.classList.add('show');
        btn.innerText = "Lỗi kết nối!";
      } finally {
        setTimeout(() => {
          btn.innerText = oText;
          btn.disabled = false;
        }, 1600);
      }
    }
  </script>
</body>
</html>
